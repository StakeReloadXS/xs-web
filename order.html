<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-site-header></header>
  <main id="main">
    <section class="section">
      <div class="container" style="max-width:40rem">
        <div id="order-root">
          <h1 style="font-size:clamp(1.75rem,5vw,2.5rem)">Your Order</h1>
          <div data-lines></div>
          <div class="total"><span>Total</span><strong data-total>$0.00</strong></div>
          <p class="muted" data-boost aria-live="polite" style="margin:0 0 1.5rem"></p>
          <form class="panel">
            <label class="field"><span>Name</span><input class="input" name="name" autocomplete="name" required></label>
            <label class="field"><span>Contact method</span>
              <select class="input" name="contactMethod"><option>Telegram</option><option>Email</option></select></label>
            <label class="field"><span>Username or email</span><input class="input" name="contact" autocomplete="off" required placeholder="@username or you@example.com"></label>
            <label class="field"><span>Notes (optional)</span><textarea class="input" name="notes" rows="3"></textarea></label>
            <button class="btn btn-block" type="submit">Submit order</button>
            <p class="muted" data-status role="status" style="margin:1rem 0 0"></p>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer data-site-footer></footer>
</body>
