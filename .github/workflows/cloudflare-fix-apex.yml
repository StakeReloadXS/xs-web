name: Fix apex DNS (Cloudflare)

# Manual only. Runs scripts/cloudflare-fix-apex.sh. Leave apply unchecked for a dry run.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (false = dry run)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fix-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repoint apex and attach domains
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            bash scripts/cloudflare-fix-apex.sh --apply
          else
            bash scripts/cloudflare-fix-apex.sh
          fi
