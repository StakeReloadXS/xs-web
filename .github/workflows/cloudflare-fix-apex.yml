name: Fix apex DNS (Cloudflare)

# Manual only. Runs scripts/cloudflare-fix-apex.sh. Leave apply unchecked for a dry run.
# Only runs from main, so a branch cannot edit the script and use the production token.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (false = dry run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-dns-apex
  cancel-in-progress: false

jobs:
  fix-apex:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to gate applies.
    environment: production-dns
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repoint apex and attach domains
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            bash scripts/cloudflare-fix-apex.sh --apply
          else
            bash scripts/cloudflare-fix-apex.sh
          fi
