name: Regenerate OG Images

on:
  push:
    branches:
      - feature/og-images
    paths:
      - '.github/workflows/regenerate-og-images.yml'
      - 'scripts/generate-og-images.js'
      - 'assets/img/page-logo.svg'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/og-images

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OG images
        run: npm run generate-og

      - name: Commit regenerated images
        run: |
          if git diff --quiet -- assets/og; then
            echo "OG images are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og
          git commit -m "Regenerate Open Graph image assets"
          git push
